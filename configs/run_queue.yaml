    outputs: [reports/tables/m3_summary.md, reports/figures/ablation_effects.png]

  # ===== 추가 실험 1: 모델 크기와 라벨 수 (가설·판정 기준은 결과 전 기록) =====
  # 라벨 수 곡선: 학습 측 라벨 25/50% (100% = m2_salad_f0, m2_2b_f0_s0, b1_f0). B1도 같은 부분집합.
  - name: p2_sft_f0_frac25
    kind: task
    smoke: false
    min_free_vram_gb: 0
    timeout_min: 90
    requires: [outputs/detector/salad/breakfast_box/meta.json, outputs/detector/salad/juice_bottle/meta.json, outputs/detector/salad/pushpins/meta.json, outputs/detector/salad/screw_bag/meta.json, outputs/detector/salad/splicing_connectors/meta.json]
    cmd: [python, -m, src.vlm.build_sft, --fold, "0", --crop-source, salad, --hard-neg, "150", --label-frac, "0.25", --name, p2_frac25]
    outputs: [data/sft/p2_frac25_f0/meta.json]
  - name: p2_sft_f0_frac50
    kind: task
    smoke: false
    min_free_vram_gb: 0
    timeout_min: 90
    requires: [outputs/detector/salad/breakfast_box/meta.json, outputs/detector/salad/juice_bottle/meta.json, outputs/detector/salad/pushpins/meta.json, outputs/detector/salad/screw_bag/meta.json, outputs/detector/salad/splicing_connectors/meta.json]
    cmd: [python, -m, src.vlm.build_sft, --fold, "0", --crop-source, salad, --hard-neg, "150", --label-frac, "0.5", --name, p2_frac50]
    outputs: [data/sft/p2_frac50_f0/meta.json]
  - name: p2_b1_f0_frac25
    smoke: false
    min_free_vram_gb: 3
    requires: [data/sft/p2_frac25_f0/meta.json]
    cmd: [python, -m, src.baselines.crop_classifier, --sft, data/sft/p2_frac25_f0, --out, outputs/baselines/p2_b1_f0_frac25_heldout.jsonl]
    outputs: [outputs/baselines/p2_b1_f0_frac25_heldout.jsonl]
  - name: p2_b1_f0_frac50
    smoke: false
    min_free_vram_gb: 3
    requires: [data/sft/p2_frac50_f0/meta.json]
    cmd: [python, -m, src.baselines.crop_classifier, --sft, data/sft/p2_frac50_f0, --out, outputs/baselines/p2_b1_f0_frac50_heldout.jsonl]
    outputs: [outputs/baselines/p2_b1_f0_frac50_heldout.jsonl]
  - name: p2_2b_f0_frac25
    smoke_as: m3_2b_f0_noneg
    requires: [data/sft/p2_frac25_f0/meta.json]
    cmd: [python, -m, src.vlm.train_lora, --data, data/sft/p2_frac25_f0, --model, Qwen/Qwen3-VL-2B-Instruct, --epochs, "3", --seed, "0", --predict-heldout, --gen-batch-size, "4"]
    outputs: [runs/p2_2b_f0_frac25/final/summary.json]
  - name: p2_2b_f0_frac50
    smoke_as: m3_2b_f0_noneg
    requires: [data/sft/p2_frac50_f0/meta.json]
    cmd: [python, -m, src.vlm.train_lora, --data, data/sft/p2_frac50_f0, --model, Qwen/Qwen3-VL-2B-Instruct, --epochs, "3", --seed, "0", --predict-heldout, --gen-batch-size, "4"]
    outputs: [runs/p2_2b_f0_frac50/final/summary.json]
  # 모델 크기: 8B QLoRA, 4B 주력과 같은 설정, 2 fold. 새 설정이라 대기열 안의 스모크 작업을 통과해야 시작한다
  # (사람이 없는 시간에도 실패하면 8B만 blocked로 남고 다른 run은 계속된다).
  - name: p2_smoke_8b
    kind: task
    smoke: false
    min_free_vram_gb: 10
    timeout_min: 45
    requires: [data/sft/m1_gt_f0/meta.json]
    cmd: [python, -m, ops.smoke, p2_8b_f0, --timeout-min, "40"]
    outputs: [ops/runtime/smoke/p2_8b_f0.json]
  - name: p2_8b_f0
    smoke_cmd: [python, -m, src.vlm.train_lora, --data, data/sft/m1_gt_f0, --model, Qwen/Qwen3-VL-8B-Instruct, --quant, nf4, --epochs, "3", --seed, "0", --predict-heldout, --gen-batch-size, "2"]
    requires: [data/sft/m2_salad_f0/meta.json]
    cmd: [python, -m, src.vlm.train_lora, --data, data/sft/m2_salad_f0, --model, Qwen/Qwen3-VL-8B-Instruct, --quant, nf4, --epochs, "3", --seed, "0", --predict-heldout, --gen-batch-size, "2"]
    outputs: [runs/p2_8b_f0/final/summary.json]
  - name: p2_8b_f1
    smoke_as: p2_8b_f0
    requires: [data/sft/m2_salad_f1/meta.json]
    cmd: [python, -m, src.vlm.train_lora, --data, data/sft/m2_salad_f1, --model, Qwen/Qwen3-VL-8B-Instruct, --quant, nf4, --epochs, "3", --seed, "0", --predict-heldout, --gen-batch-size, "2"]
    outputs: [runs/p2_8b_f1/final/summary.json]
  # P2 집계: 모든 P2 run이 끝나면 보고서를 만든다 (CPU)
  - name: p2_report
    kind: task
    smoke: false
    min_free_vram_gb: 0
    timeout_min: 30
    requires: [runs/p2_2b_f0_frac25/final/summary.json, runs/p2_2b_f0_frac50/final/summary.json, outputs/baselines/p2_b1_f0_frac25_heldout.jsonl, outputs/baselines/p2_b1_f0_frac50_heldout.jsonl, runs/p2_8b_f0/final/summary.json, runs/p2_8b_f1/final/summary.json]
    cmd: [python, -m, src.report.p2_report]
    outputs: [reports/tables/p2_summary.md]
  # --- 추가 실험 2: 입력 표현 (가설·판정 기준은 결과 전 기록). 1단계: 2B fold 0 모델로 fold 1 이미지 선별 ---
  # 변형 A: 탐지기 줄에 SALAD 세 항 백분위(--det-terms). 변형 B: B1 상위 2그룹 후보(--b1-hints, 학습 측은 out-of-fold 확률).
  # B1 확률 파일(outputs/baselines/b1_f{f}_probs.jsonl)은 crop_classifier --probs-out으로 미리 만든다.
  - name: p3_sft_f0_terms
    kind: task
    smoke: false
    min_free_vram_gb: 0
    timeout_min: 90
    requires: [outputs/detector/salad/breakfast_box/meta.json, outputs/detector/salad/juice_bottle/meta.json, outputs/detector/salad/pushpins/meta.json, outputs/detector/salad/screw_bag/meta.json, outputs/detector/salad/splicing_connectors/meta.json]
    cmd: [python, -m, src.vlm.build_sft, --fold, "0", --crop-source, salad, --hard-neg, "150", --det-terms, --name, p3_terms]
    outputs: [data/sft/p3_terms_f0/meta.json]
  - name: p3_sft_f0_hints
    kind: task
    smoke: false
    min_free_vram_gb: 0
    timeout_min: 90
    requires: [outputs/baselines/b1_f0_probs.jsonl, outputs/baselines/b1_f0_probs.oof.jsonl]
    cmd: [python, -m, src.vlm.build_sft, --fold, "0", --crop-source, salad, --hard-neg, "150", --b1-hints, outputs/baselines/b1_f0_probs.jsonl, --name, p3_hints]
    outputs: [data/sft/p3_hints_f0/meta.json]
  - name: p3_2b_f0_terms
    # 원복으로 이전 스모크 기록(ops/runtime/smoke)이 지워졌고 train_lora도 바뀌었으므로 새 스모크 통과 기록이 필요하다
    requires: [data/sft/p3_terms_f0/meta.json]
    cmd: [python, -m, src.vlm.train_lora, --data, data/sft/p3_terms_f0, --model, Qwen/Qwen3-VL-2B-Instruct, --epochs, "3", --seed, "0", --predict-heldout, --gen-batch-size, "4"]
    outputs: [runs/p3_2b_f0_terms/final/summary.json]
  - name: p3_2b_f0_hints
    smoke_as: p3_2b_f0_terms
    requires: [data/sft/p3_hints_f0/meta.json]
    cmd: [python, -m, src.vlm.train_lora, --data, data/sft/p3_hints_f0, --model, Qwen/Qwen3-VL-2B-Instruct, --epochs, "3", --seed, "0", --predict-heldout, --gen-batch-size, "4"]
    outputs: [runs/p3_2b_f0_hints/final/summary.json]
  # 입력 표현 실험 1단계 집계: 선별 표와 4B 확인 대상(그룹 전체 효과가 양수이고 가장 큰 변형) 기록.
  - name: p3_report
    kind: task
    smoke: false
    min_free_vram_gb: 0
    timeout_min: 30
    requires: [runs/p3_2b_f0_terms/final/summary.json, runs/p3_2b_f0_hints/final/summary.json]
    cmd: [python, -m, src.report.p3_report]
    outputs: [reports/tables/p3_summary.md, reports/tables/p3_summary.json]
  # 입력 표현 실험 2단계 자동 선별(사람 개입 없음): 선정 변형의 fold 1 SFT 생성 + 표식 p3_selected_<key>.ok + 아래 4B run의 enabled 전환.
  - name: p3_select
    kind: task
    smoke: false
    min_free_vram_gb: 0
    timeout_min: 90
    requires: [reports/tables/p3_summary.json]
    cmd: [python, -m, src.report.p3_select]
    outputs: [reports/tables/p3_selected.json]
  # 입력 표현 실험 2단계: 선정된 변형만 4B 2-fold 확인(기준 Ours 4B seed 0). 표식 파일이 생길 때까지 blocked, p3_select가 비선정 변형을 끈다.
  # 4B 스모크는 p3_4b_f0_terms 하나로 대표(설정 계열 동일: 4B QLoRA, 데이터 경로만 다름).
  - name: p3_4b_f0_terms
    enabled: false   # p3_select:terms
    requires: [data/sft/p3_terms_f0/meta.json, reports/tables/p3_selected_terms.ok]
    cmd: [python, -m, src.vlm.train_lora, --data, data/sft/p3_terms_f0, --model, Qwen/Qwen3-VL-4B-Instruct, --quant, nf4, --epochs, "3", --seed, "0", --predict-heldout, --gen-batch-size, "2"]
    outputs: [runs/p3_4b_f0_terms/final/summary.json]
  - name: p3_4b_f1_terms
    enabled: false   # p3_select:terms
    smoke_as: p3_4b_f0_terms
    requires: [data/sft/p3_terms_f1/meta.json, reports/tables/p3_selected_terms.ok]
    cmd: [python, -m, src.vlm.train_lora, --data, data/sft/p3_terms_f1, --model, Qwen/Qwen3-VL-4B-Instruct, --quant, nf4, --epochs, "3", --seed, "0", --predict-heldout, --gen-batch-size, "2"]
    outputs: [runs/p3_4b_f1_terms/final/summary.json]
  - name: p3_4b_f0_hints
    enabled: true   # p3_select:hints
    smoke_as: p3_4b_f0_terms
    requires: [data/sft/p3_hints_f0/meta.json, reports/tables/p3_selected_hints.ok]
    cmd: [python, -m, src.vlm.train_lora, --data, data/sft/p3_hints_f0, --model, Qwen/Qwen3-VL-4B-Instruct, --quant, nf4, --epochs, "3", --seed, "0", --predict-heldout, --gen-batch-size, "2"]
    outputs: [runs/p3_4b_f0_hints/final/summary.json]
  - name: p3_4b_f1_hints
    enabled: true   # p3_select:hints
    smoke_as: p3_4b_f0_terms
    requires: [data/sft/p3_hints_f1/meta.json, reports/tables/p3_selected_hints.ok]
    cmd: [python, -m, src.vlm.train_lora, --data, data/sft/p3_hints_f1, --model, Qwen/Qwen3-VL-4B-Instruct, --quant, nf4, --epochs, "3", --seed, "0", --predict-heldout, --gen-batch-size, "2"]
    outputs: [runs/p3_4b_f1_hints/final/summary.json]
  # 입력 표현 실험 최종 집계(4B 확인 포함)와 표1 갱신. 순서상 마지막이라 앞의 run이 모두 끝난(또는 꺼진) 뒤 실행된다.
  - name: p3_report_final
    kind: task
    smoke: false
    min_free_vram_gb: 0
    timeout_min: 30
    requires: [reports/tables/p3_selected.json]
    cmd: [python, -m, src.report.p3_report]
    outputs: [reports/tables/p3_summary.md]
  - name: p3_table1
    kind: task
    smoke: false
    min_free_vram_gb: 0
    timeout_min: 30
    requires: [reports/tables/p3_selected.json]
    cmd: [python, -m, src.report.m4_tables]
    outputs: [reports/tables/table1_main.md]
