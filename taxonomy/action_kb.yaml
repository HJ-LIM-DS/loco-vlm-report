# 결함 그룹 및 조치 지식베이스 v2 (가상 SOP(표준 작업 절차). 실제 현장 절차가 아님, README에 명시)
#
# 구조
#   <category>:
#     ko_name: 제품 한국어 이름
#     spec:    정상 규격 (VLM 프롬프트에 그대로 들어감, 정상 이미지로 확인)
#     unknown: 미등록 결함일 때 쓰는 그룹 (ko_label/action/disposition/severity)
#     groups:
#       <group_id>:
#         ko_label:    1줄 출력의 결함 그룹 이름
#         action:      2줄 출력의 조치 문장 (즉시 조치 + 원인 점검)
#         disposition: 폐기 | 재작업 | 격리
#         severity:    라인정지 | 일반 (라인정지 = 즉시 라인을 세우고 원인을 제거해야 하는 결함)
#         root_cause:  설비 | 자재 | 방법 (우선 점검 대상)
#         exclusive:   true면 세부 결함이 같은 속성의 서로 배타적인 상태라 한 이미지에 1종만 나옴
#                      (예: 과일 구성 수량). 2종 이상 출력은 형식 위반으로 보고 Guard가 세부를 삭제
#         defects:     { <defects_config.json의 defect_name>: {ko, type, loc_mode} }
#
# 세부 결함 필드
#   ko:       1줄 출력의 세부 결함 한국어 (그룹에 세부 결함이 1종뿐이면 출력에서 생략)
#   type:     논리 | 구조 (LOCO 폴더 기준, 세부 결함마다 정확히 한 폴더에 속함)
#   loc_mode: GT 마스크로 위치를 정의하는 방식 (src/data/mask_stats.py 통계 + 마스크 시트 확인으로 확정)
#     point     한 부품·한 지점을 칠함 → 3x3 칸 이름 (긴 변 2% closing 후 마스크 면적 최대 칸)
#     global    제품 전체, 구획 전체, 부품 사이의 관계(배선·매칭)를 칠함 → "전체"
#     instances 같은 종류 부품을 모두 칠해 어느 개체가 결함인지 GT로 알 수 없음 → 위치 생략

breakfast_box:
  ko_name: 아침식사 박스
  spec: "좌측 구획에 귤 2개와 천도복숭아 1개, 우측 상단 구획에 시리얼, 우측 하단 구획에 바나나 칩과 아몬드가 정해진 양과 비율로 담김"
  unknown:
    ko_label: 미분류 이상
    action: 해당 제품을 격리하고, 품질 담당자 확인을 요청
    disposition: 격리
    severity: 일반
  groups:
    fruit_count:
      ko_label: 과일 구성 수량 불일치
      action: 과일 수량을 규격(귤 2개, 천도복숭아 1개)으로 보정해 재포장하고, 과일 투입부 계수 센서를 점검
      disposition: 재작업
      severity: 일반
      root_cause: 설비
      exclusive: true
      defects:
        2_nectarines_1_tangerine: {ko: "천도복숭아 2개, 귤 1개", type: 논리, loc_mode: instances}
        1_nectarine_1_tangerine: {ko: "천도복숭아 1개, 귤 1개", type: 논리, loc_mode: point}
        0_nectarines_2_tangerines: {ko: "천도복숭아 없음, 귤 2개", type: 논리, loc_mode: point}
        0_nectarines_3_tangerines: {ko: "천도복숭아 없음, 귤 3개", type: 논리, loc_mode: instances}
        3_nectarines_0_tangerines: {ko: "천도복숭아 3개, 귤 없음", type: 논리, loc_mode: instances}
        0_nectarines_1_tangerine: {ko: "천도복숭아 없음, 귤 1개", type: 논리, loc_mode: point}
        0_nectarines_0_tangerines: {ko: "과일 전부 없음", type: 논리, loc_mode: global}
        0_nectarines_4_tangerines: {ko: "천도복숭아 없음, 귤 4개", type: 논리, loc_mode: instances}
    component_missing:
      ko_label: 시리얼·토핑 구성품 누락
      action: 누락 구성품을 보충 투입한 뒤 재검사하고, 해당 디스펜서의 공급 막힘과 잔량을 점검
      disposition: 재작업
      severity: 일반
      root_cause: 설비
      defects:
        missing_almonds: {ko: "아몬드 누락", type: 논리, loc_mode: point}
        missing_bananas: {ko: "바나나 칩 누락", type: 논리, loc_mode: point}
        missing_toppings: {ko: "토핑 전체 누락", type: 논리, loc_mode: point}
        missing_cereals: {ko: "시리얼 누락", type: 논리, loc_mode: point}
        missing_cereals_and_toppings: {ko: "시리얼과 토핑 모두 누락", type: 논리, loc_mode: global}
    compartments_swapped:
      ko_label: 시리얼·토핑 구획 위치 뒤바뀜
      action: 재포장 라인으로 회송하고, 충전 스테이션 투입 순서와 트레이 방향 설정을 점검
      disposition: 재작업
      severity: 일반
      root_cause: 방법
      defects:
        compartments_swapped: {ko: "시리얼과 토핑 구획이 서로 바뀜", type: 논리, loc_mode: global}
    fill_amount:
      ko_label: 내용물 양·비율 이상
      action: 정량으로 재충전하고, 디스펜서 투입량 캘리브레이션을 점검
      disposition: 재작업
      severity: 일반
      root_cause: 설비
      defects:
        overflow: {ko: "내용물 넘침", type: 논리, loc_mode: point}
        underflow: {ko: "내용물 부족", type: 논리, loc_mode: global}
        wrong_ratio: {ko: "시리얼과 토핑 비율 불균형", type: 논리, loc_mode: global}
    mixed_cereals:
      ko_label: 시리얼 이종 혼입
      action: 해당 박스를 폐기하고, 시리얼 호퍼의 원료 혼입과 품목 전환 세척 여부를 점검
      disposition: 폐기
      severity: 라인정지
      root_cause: 자재
      defects:
        mixed_cereals: {ko: "다른 종류 시리얼 혼입", type: 구조, loc_mode: global}
    food_damaged:
      ko_label: 과일·토핑 손상
      action: 손상 품목을 교체하고, 투입·이송 구간 낙하 충격과 원료 입고 품질을 점검
      disposition: 재작업
      severity: 일반
      root_cause: 설비
      defects:
        fruit_damaged: {ko: "과일 손상", type: 구조, loc_mode: point}
        toppings_crushed: {ko: "토핑 부서짐", type: 구조, loc_mode: point}
    box_damaged:
      ko_label: 트레이 파손
      action: 트레이를 교체해 재포장하고, 트레이 성형 및 이송 가이드 간섭을 점검
      disposition: 재작업
      severity: 일반
      root_cause: 설비
      defects:
        box_damaged: {ko: "트레이 파손", type: 구조, loc_mode: point}
    contamination:
      ko_label: 이물 혼입
      action: 해당 제품을 격리 폐기하고, 라인 정지 후 이물 유입 경로와 설비 청결 상태를 점검
      disposition: 폐기
      severity: 라인정지
      root_cause: 설비
      defects:
        contamination: {ko: "이물 혼입", type: 구조, loc_mode: point}

